AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Layout/LineLength:
  Max: 140

Metrics/MethodLength:
  Max: 40
  Exclude:
    - "lib/fizzy_mcp/tools/*.rb"

Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "lib/fizzy_mcp/tools/*.rb"

Metrics/AbcSize:
  Max: 30
  Exclude:
    - "lib/fizzy_mcp/tools/*.rb"

Metrics/ParameterLists:
  Exclude:
    - "lib/fizzy/api/cards.rb"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Lint/MissingSuper:
  Enabled: false
